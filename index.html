<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f1c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>LK SMART STUDIES</title>
    
    <!-- PWA Manifest Link (Placeholder for future implementation) -->
    <link rel="manifest" href="manifest.json">

    <style>
        /* ==================================================
           CSS VARIABLES & RESET
           ================================================== */
        :root {
            --bg-dark: #0a0f1c;
            --brand-primary: #3a86ff;
            --brand-secondary: #8338ec;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a0a5b5;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        /* ==================================================
           BACKGROUND & 3D ENVIRONMENT
           ================================================== */
        .scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            perspective: 1000px;
            z-index: 1;
            pointer-events: none;
        }

        /* Ambient Glows */
        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: pulseGlow 8s infinite alternate;
        }
        .glow-1 {
            top: -10%; left: -10%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, var(--brand-secondary) 0%, transparent 70%);
        }
        .glow-2 {
            bottom: -10%; right: -10%; width: 60vw; height: 60vw;
            background: radial-gradient(circle, var(--brand-primary) 0%, transparent 70%);
            animation-delay: -4s;
        }

        /* Floating Background Particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }
        
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            animation: floatParticle 15s infinite linear;
        }

        /* ==================================================
           UI CONTAINERS
           ================================================== */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
            transform-style: preserve-3d;
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
            transform: scale(0.95) translateZ(-100px);
            pointer-events: none;
        }

        .active {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateZ(0);
            pointer-events: auto;
        }

        /* ==================================================
           GLASSMORPHISM CARDS
           ================================================== */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            transform-style: preserve-3d;
            max-width: 90%;
            width: 400px;
            position: relative;
        }

        /* Responsive scaling for larger screens */
        @media (min-width: 768px) {
            .glass-card {
                width: 600px;
                padding: 60px 40px;
            }
        }

        /* ==================================================
           TYPOGRAPHY
           ================================================== */
        .brand-title {
            font-size: clamp(28px, 6vw, 42px);
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffffff 0%, #b0c4de 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transform: translateZ(30px); /* 3D pop */
        }

        .tagline {
            font-size: clamp(14px, 3vw, 18px);
            font-weight: 600;
            color: var(--brand-primary);
            margin-bottom: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
            transform: translateZ(20px);
        }

        .message {
            font-size: clamp(14px, 3vw, 16px);
            color: var(--text-muted);
            margin-bottom: 40px;
            transform: translateZ(15px);
        }

        /* ==================================================
           3D PREMIUM BUTTONS
           ================================================== */
        .btn-3d {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 280px;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            border: none;
            border-radius: 12px;
            cursor: pointer;
            outline: none;
            transform-style: preserve-3d;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 
                0 10px 20px rgba(58, 134, 255, 0.3),
                0 6px 0px #2a5cb8, /* Physical 3D Depth */
                inset 0 1px 1px rgba(255, 255, 255, 0.4);
            transform: translateZ(40px); /* Lift off card */
        }

        .btn-3d:hover {
            transform: translateZ(45px) translateY(-2px);
            box-shadow: 
                0 15px 25px rgba(58, 134, 255, 0.4),
                0 8px 0px #2a5cb8,
                inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }

        .btn-3d:active {
            transform: translateZ(30px) translateY(6px);
            box-shadow: 
                0 2px 5px rgba(58, 134, 255, 0.3),
                0 0px 0px #2a5cb8,
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }
        
        .btn-3d:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 4px;
        }

        /* ==================================================
           FLOATING EDUCATIONAL ELEMENTS (MAIN INTRO)
           ================================================== */
        .floating-elements {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        .float-item {
            position: absolute;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            opacity: 0; /* Hidden initially, faded in via JS/CSS */
        }

        /* Positioning and animation for floating elements */
        .active .float-item {
            animation: floatObject 6s infinite ease-in-out alternate, fadeIn 1s forwards;
        }

        .item-pdf { top: -20%; left: -10%; animation-delay: 0s, 0.5s !important; transform: translateZ(50px) rotate(-10deg); }
        .item-notes { top: 20%; right: -25%; animation-delay: -2s, 0.7s !important; transform: translateZ(80px) rotate(15deg); }
        .item-books { bottom: -15%; left: -20%; animation-delay: -4s, 0.9s !important; transform: translateZ(60px) rotate(5deg); }
        .item-video { bottom: 10%; right: -15%; animation-delay: -1s, 1.1s !important; transform: translateZ(40px) rotate(-15deg); }

        @media (max-width: 600px) {
            .item-pdf { top: -15%; left: 0%; }
            .item-notes { top: -5%; right: 0%; }
            .item-books { bottom: -15%; left: 0%; }
            .item-video { bottom: 5%; right: 0%; }
            .float-item { transform: scale(0.85); padding: 8px 12px;}
        }

        /* SVGs for icons */
        .icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* ==================================================
           ANIMATIONS
           ================================================== */
        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.2); opacity: 0.7; }
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) translateX(0) translateZ(-200px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-20vh) translateX(50px) translateZ(200px) rotate(360deg); opacity: 0; }
        }

        @keyframes floatObject {
            0% { transform: translateY(0) translateZ(var(--z-index, 50px)) rotate(var(--rot, 0deg)); }
            100% { transform: translateY(-20px) translateZ(var(--z-index, 50px)) rotate(calc(var(--rot, 0deg) + 5deg)); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Accessibility: Reduce Motion */
        @media (prefers-reduced-motion: reduce) {
            .glow, .particle, .float-item {
                animation: none !important;
            }
            .ui-layer {
                transition: opacity 0.3s ease;
            }
            .btn-3d {
                transition: none;
                transform: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- 3D Background Scene -->
    <div class="scene" aria-hidden="true">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="particles" id="particles">
            <!-- Particles injected via JS -->
        </div>
    </div>

    <!-- STEP 1: START JOURNEY SCREEN -->
    <main class="ui-layer active" id="step1-start">
        <div class="glass-card" id="card1">
            <h1 class="brand-title">LK SMART STUDIES</h1>
            <div class="tagline">Learn • Explore • Grow</div>
            <p class="message">Your premium learning journey starts here.</p>
            
            <button class="btn-3d" id="btn-start" aria-label="Start your learning journey">
                START JOURNEY
            </button>
        </div>
    </main>

    <!-- STEP 4: MAIN INTRO SCREEN -->
    <main class="ui-layer hidden" id="step2-intro">
        <div class="glass-card" id="card2">
            
            <!-- Floating Elements (Anchored to Card for relative 3D space) -->
            <div class="floating-elements">
                <div class="float-item item-pdf" style="--z-index: 50px; --rot: -10deg;">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                    PDFs
                </div>
                <div class="float-item item-notes" style="--z-index: 80px; --rot: 15deg;">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    Notes
                </div>
                <div class="float-item item-books" style="--z-index: 60px; --rot: 5deg;">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
                    Books
                </div>
                <div class="float-item item-video" style="--z-index: 40px; --rot: -15deg;">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
                    Resources
                </div>
            </div>

            <h2 class="brand-title">LK SMART STUDIES</h2>
            <div class="tagline">Welcome to LK SMART STUDIES</div>
            <p class="message">Immerse yourself in a world of knowledge, structured notes, and powerful study materials designed for your success.</p>
            
            <button class="btn-3d" id="btn-enter" aria-label="Enter LK Smart Studies Dashboard">
                ENTER LK SMART STUDIES
            </button>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // ==================================================
            // DOM ELEMENTS
            // ==================================================
            const screenStart = document.getElementById('step1-start');
            const screenIntro = document.getElementById('step2-intro');
            const btnStart = document.getElementById('btn-start');
            const btnEnter = document.getElementById('btn-enter');
            const card1 = document.getElementById('card1');
            const card2 = document.getElementById('card2');
            
            // ==================================================
            // SESSION MANAGEMENT
            // ==================================================
            // If the user has already seen the intro this session, 
            // skip the start screen and jump right to the Enter button.
            if (sessionStorage.getItem('lk_intro_played') === 'true') {
                screenStart.classList.remove('active');
                screenStart.classList.add('hidden');
                screenIntro.classList.remove('hidden');
                screenIntro.classList.add('active');
            }

            // ==================================================
            // PARTICLE GENERATION
            // ==================================================
            const particleContainer = document.getElementById('particles');
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            
            if (!prefersReducedMotion) {
                for (let i = 0; i < 20; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    // Randomize size, position, and animation delay
                    const size = Math.random() * 6 + 2;
                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;
                    particle.style.left = `${Math.random() * 100}vw`;
                    particle.style.animationDuration = `${Math.random() * 10 + 10}s`;
                    particle.style.animationDelay = `-${Math.random() * 15}s`;
                    particleContainer.appendChild(particle);
                }
            }

            // ==================================================
            // FULLSCREEN API HELPER
            // ==================================================
            function requestFullscreen() {
                const docElm = document.documentElement;
                let requestPromise = null;
                
                if (docElm.requestFullscreen) {
                    requestPromise = docElm.requestFullscreen();
                } else if (docElm.mozRequestFullScreen) { // Firefox
                    requestPromise = docElm.mozRequestFullScreen();
                } else if (docElm.webkitRequestFullscreen) { // Chrome, Safari and Opera
                    requestPromise = docElm.webkitRequestFullscreen();
                } else if (docElm.msRequestFullscreen) { // IE/Edge
                    requestPromise = docElm.msRequestFullscreen();
                }

                // Gracefully handle rejection (e.g., if browser blocks it)
                // The website MUST continue normally without error.
                if (requestPromise !== undefined && requestPromise !== null) {
                    requestPromise.catch(err => {
                        console.log("Fullscreen request was denied or not supported. Continuing standard layout.");
                    });
                }
            }

            // ==================================================
            // INTERACTION: START JOURNEY
            // ==================================================
            btnStart.addEventListener('click', () => {
                // 1. Attempt Fullscreen (User Initiated)
                requestFullscreen();

                // 2. Play Transition Animation
                screenStart.classList.remove('active');
                screenStart.classList.add('hidden');

                setTimeout(() => {
                    screenIntro.classList.remove('hidden');
                    screenIntro.classList.add('active');
                    // Mark session so it doesn't replay unnecessarily
                    sessionStorage.setItem('lk_intro_played', 'true');
                }, 400); // Wait for fade-out to finish
            });

            // ==================================================
            // INTERACTION: ENTER WEBSITE
            // ==================================================
            btnEnter.addEventListener('click', () => {
                // Animate out before redirecting
                screenIntro.classList.remove('active');
                screenIntro.classList.add('hidden');
                
                setTimeout(() => {
                    // Navigate to home.html as instructed
                    window.location.href = "home.html";
                }, 500);
            });

            // ==================================================
            // 3D MOUSE PARALLAX EFFECT (DESKTOP)
            // ==================================================
            if (!prefersReducedMotion && window.innerWidth > 768) {
                document.addEventListener('mousemove', (e) => {
                    const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
                    const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
                    
                    if (screenStart.classList.contains('active')) {
                        card1.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
                    } else if (screenIntro.classList.contains('active')) {
                        card2.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
                    }
                });

                // Reset tilt on mouse leave
                document.addEventListener('mouseleave', () => {
                    card1.style.transform = `rotateY(0deg) rotateX(0deg)`;
                    card2.style.transform = `rotateY(0deg) rotateX(0deg)`;
                });
            }
        });
    </script>
</body>
</html>
